# ============================================
# Docker Compose для локальной разработки
# ============================================
services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: snt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: snt_user
      POSTGRES_PASSWORD: snt_password
      POSTGRES_DB: snt_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snt_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Приложение Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: snt-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://snt_user:snt_password@db:5432/snt_db?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-key-change-in-production}
      WS_PORT: "3001"
      WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET:-dev-ws-secret-change-in-production}
      NEXT_PUBLIC_APP_NAME: "СНТ Берёзки-НТ"
      NEXT_PUBLIC_APP_DESCRIPTION: "Управление садоводческим товариществом"
      MAX_FILE_SIZE: "10485760"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
