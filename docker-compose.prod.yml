# ============================================
# Docker Compose для продакшена (VPS-A)
# Двухсерверная архитектура: на VPS-A только
# app (Next.js из registry), nginx, certbot.
# БД (VPS-DB) поднимается отдельно docker-compose.db.yml.
# ============================================
services:
  # Приложение Next.js (образ из container registry, сборка на CI)
  app:
    image: ${IMAGE:-snt-app/snt:latest}
    container_name: snt-prod-app
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WS_PORT: "3001"
      WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET}
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-10485760}"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - snt-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: snt-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl/live/${DOMAIN}:/etc/nginx/ssl:ro
      - acme_data:/var/www/certbot
    depends_on:
      - app
    networks:
      - snt-network

  # Certbot / Let's Encrypt (обеспечение сертификатов)
  certbot:
    image: certbot/certbot:latest
    container_name: snt-prod-certbot
    restart: "no"
    volumes:
      - ./ssl:/etc/letsencrypt
      - acme_data:/var/www/certbot
    entrypoint: ['/bin/sh', '-c']
    command: |
      'certbot certonly --webroot
       --webroot-path=/var/www/certbot
       --email $$ACME_EMAIL
       --agree-tos
       --no-eff-email
       --non-interactive
       -d $$DOMAIN || true'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DOMAIN: ${DOMAIN}
    depends_on:
      - nginx
    networks:
      - snt-network

volumes:
  acme_data:

networks:
  snt-network:
    driver: bridge
