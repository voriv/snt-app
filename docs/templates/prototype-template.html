<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: {Название страницы}</title>
  <link rel="stylesheet" href="../../../src/app/globals.css">
  <style>
    /* ==================== Переключатель тем ==================== */
    .theme-switcher {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 999;
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--theme-bg-primary);
      border: 1px solid var(--theme-border-color);
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .theme-switcher button {
      padding: 6px 12px;
      border: 1px solid var(--theme-border-color);
      background: var(--theme-bg-secondary);
      color: var(--theme-text-primary);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .theme-switcher button:hover {
      background: var(--theme-accent);
      color: white;
      border-color: var(--theme-accent);
    }
    .theme-switcher button.active {
      background: var(--theme-accent);
      color: white;
      border-color: var(--theme-accent);
    }

    /* ==================== Базовые стили прототипа ==================== */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .prototype {
      min-height: 100vh;
      background: var(--theme-bg-secondary);
      color: var(--theme-text-primary);
      padding-top: 60px; /* место для переключателя тем */
    }

    /* ==================== Утилиты ==================== */
    .proto-card {
      background: var(--theme-bg-primary);
      border: 1px solid var(--theme-border-color);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .proto-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .proto-button:hover { opacity: 0.9; }
    .proto-button-primary {
      background: var(--theme-accent);
      color: white;
    }
    .proto-button-secondary {
      background: transparent;
      color: var(--theme-text-primary);
      border: 1px solid var(--theme-border-color);
    }
    .proto-button-danger {
      background: var(--theme-danger);
      color: white;
    }
    .proto-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
    }
    .proto-badge-success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--theme-success);
    }
    .proto-badge-warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--theme-warning);
    }
    .proto-badge-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--theme-danger);
    }
    .proto-badge-info {
      background: rgba(59, 130, 246, 0.1);
      color: var(--theme-info);
    }
    .proto-text-primary { color: var(--theme-text-primary); }
    .proto-text-secondary { color: var(--theme-text-secondary); }
    .proto-text-heading { font-size: 24px; font-weight: 600; }
    .proto-text-body { font-size: 14px; }
    .proto-text-small { font-size: 12px; }
  </style>
</head>
<body data-theme="light">
  <!-- Переключатель тем -->
  <div class="theme-switcher">
    <button onclick="setTheme('light')" id="btn-light" class="active">Light</button>
    <button onclick="setTheme('dark')" id="btn-dark">Dark</button>
    <button onclick="setTheme('green')" id="btn-green">Green</button>
  </div>
  
  <div class="prototype">
    <!-- ========== Макет ========== -->
    <!-- Вставьте ваш макет сюда -->
    
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px;">
      <h1 class="proto-text-heading">Заголовок страницы</h1>
      <p class="proto-text-secondary">Описание страницы</p>
      
      <div class="proto-card" style="margin-top: 24px;">
        <h2 class="proto-text-heading" style="font-size: 20px;">Карточка</h2>
        <p class="proto-text-body">Содержимое карточки</p>
        <div style="margin-top: 16px;">
          <button class="proto-button proto-button-primary">Primary</button>
          <button class="proto-button proto-button-secondary" style="margin-left: 8px;">Secondary</button>
          <button class="proto-button proto-button-danger" style="margin-left: 8px;">Danger</button>
        </div>
        <div style="margin-top: 16px;">
          <span class="proto-badge proto-badge-success">Активен</span>
          <span class="proto-badge proto-badge-warning" style="margin-left: 8px;">На проверке</span>
          <span class="proto-badge proto-badge-danger" style="margin-left: 8px;">Ошибка</span>
        </div>
      </div>
    </div>
    
    <!-- ========== Конец макета ========== -->
  </div>
  
  <script>
    function setTheme(theme) {
      document.body.dataset.theme = theme;
      document.querySelectorAll('.theme-switcher button').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById('btn-' + theme).classList.add('active');
    }
  </script>
</body>
</html>
